plugins {
	id("dev.kikugie.loom-back-compat")
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName.set("racoons-rabies+" + (property("minecraft_version") as String))
}

loom {
	accessWidenerPath = rootProject.file("src/main/resources/accesswideners/${stonecutter.current.version}.accesswidener")
}

repositories {
	if (sc.current.parsed < "26.1") {
		exclusiveContent {
			forRepository {
				maven {
					name = 'GeckoLib'
					url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
				}
			}
			filter {
				includeGroup('software.bernie.geckolib')
			}
		}
	} else {
		exclusiveContent {
			forRepository {
				maven {
					name = 'GeckoLib'
					url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
				}
			}
			filter {
				includeGroupAndSubgroups('com.geckolib')
			}
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { url "https://maven.ladysnake.org/releases" }
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:" + property("minecraft_version") as String

	loomx.applyMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:" + property("loader_version") as String

	modImplementation "net.fabricmc.fabric-api:fabric-api:" + property("fabric_api_version") as String

	if (sc.current.parsed >= "26.1") {
		modImplementation "maven.modrinth:trinkets-updated:${property("trinkets_version")}"
	} else if (sc.current.parsed >= "1.21.4") {
		modImplementation "maven.modrinth:trinkets-canary:${property("trinkets_version")}"
	} else {
		modImplementation "maven.modrinth:trinkets:${property("trinkets_version")}"
	}

	if (sc.current.parsed >= "26.1") {
		modImplementation "com.geckolib:geckolib-fabric-${property("minecraft_version")}:${property("geckolib_version")}"
	} else {
		modImplementation "software.bernie.geckolib:geckolib-fabric-${property("minecraft_version")}:${property("geckolib_version")}"
	}

	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${property("cca_version")}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${property("cca_version")}"

}

processResources {
	inputs.property "version", project.version
	def minecraft = stonecutter.current.version
	def injection = "$minecraft" as String
	injection = "~" + injection
	filesMatching("fabric.mod.json") {
		expand(["version": project.version,
				"minecraft_version": injection,
				"aw_file": "accesswideners/${stonecutter.current.version}.accesswidener"
				])
	}
}

tasks.withType(JavaCompile).configureEach {
	if (sc.current.parsed < "1.21.1") {
		it.options.release = 17
	}else if (sc.current.parsed < "26.1") {
		it.options.release = 21
	} else {
		it.options.release = 25
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	if (sc.current.parsed < "1.21.1") {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	} else if (sc.current.parsed < "26.1") {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	} else {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}